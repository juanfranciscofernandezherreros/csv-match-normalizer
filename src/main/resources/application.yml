spring:
  application.name: csv-match-normalizer
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:csv-match-normalizer}
      auto-offset-reset: earliest
      key-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
      value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
      properties:
        schema.registry.url: ${KAFKA_SCHEMA_REGISTRY_URL:http://schema-registry:8081}
        specific.avro.reader: true
app:
  input-topic: ${KAFKA_FILE_READY_TOPIC:file.ready}
  csv-root: ${CSV_ALLOWED_ROOT:/data/csv}
  output-root: ${NORMALIZED_OUTPUT_ROOT:/data/csv/ready}
